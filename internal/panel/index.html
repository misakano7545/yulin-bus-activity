<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玉林实时公交</title>
<style>
/* ── 设计令牌 ──────────────────────────────────────────────────────
   浅色是主场景（对照设计稿的白色卡片 + 淡青底图）；深色沿用原来的冷石墨。 */
:root {
  --bg:#0c0e14; --surface:#14171f; --surface-2:#1a1e28;
  --line:#262c3a; --line-soft:#1e232e;
  --ink:#e8ebf2; --ink-2:#a8b0c2; --ink-3:#838b9b;
  --accent:#7c6ff0; --accent-ink:#fff; --accent-soft:rgba(124,111,240,.16);
  --ok:#3ddc97; --warn:#f5b544; --bad:#f0655f;
  --map:#12161c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
[data-theme="light"] {
  --bg:#f4f5f8; --surface:#fff; --surface-2:#f6f7fa;
  --line:#e4e7ee; --line-soft:#eef0f5;
  --ink:#14171f; --ink-2:#545c6e; --ink-3:#6b7280;
  --accent:#5b4fd8; --accent-ink:#fff; --accent-soft:rgba(91,79,216,.09);
  --ok:#0b7548; --warn:#8a5a0c; --bad:#c03630;
  --map:#e9ede6;
  --shadow:0 1px 2px rgba(16,20,32,.06),0 10px 30px -16px rgba(16,20,32,.18);
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
html,body { height:100%; }
body { background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
.eta { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ── 壳层 ──────────────────────────────────────────────────────────── */
.shell { display:grid; grid-template-columns:336px 1fr; height:100vh; height:100dvh; }
.scrim { display:none; }
/* 主区必须显式 flex 列：不然地图容器撑不出高度（stage 里全绝对定位，高度会是 0） */
.main { display:flex; flex-direction:column; min-width:0; min-height:0; }

.side { background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0; }
.brand { display:flex; align-items:center; gap:10px; padding:15px 16px 13px;
  border-bottom:1px solid var(--line-soft); flex:none; }
.brand .logo { width:32px; height:32px; border-radius:9px; background:var(--accent); color:#fff;
  display:grid; place-items:center; flex:none; }
.brand .logo svg { width:19px; height:19px; }
.brand .name { font-weight:650; font-size:15px; letter-spacing:-.01em; }
.brand .sub { color:var(--ink-3); font-size:11.5px; margin-top:1px; }

/* 侧栏分四段：线路 / 实时到站 / 本线信息 / 线路走向。整段滚动，不是只有列表滚。 */
.sidebody { flex:1; min-height:0; overflow-y:auto; padding:2px 12px 22px; }
.sect { padding-top:15px; }
.sect > h2 { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600;
  color:var(--ink-3); letter-spacing:.02em; margin-bottom:9px; }
.sect > h2 .tail { margin-left:auto; font:400 11px var(--mono); color:var(--ink-3); }

/* ── 线路列表 ──────────────────────────────────────────────────────── */
.lines { list-style:none; display:flex; flex-direction:column; gap:6px; }
.lines li { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px;
  border:1px solid var(--line-soft); background:var(--surface-2); cursor:pointer; }
.lines li:hover { border-color:var(--ink-3); }
.lines li.on { border-color:var(--accent); background:var(--accent-soft); }
.lines .badge { flex:none; min-width:46px; height:24px; padding:0 7px; border-radius:7px;
  display:grid; place-items:center; color:#fff; font:650 12px/1 var(--mono); }
.lines .to { min-width:0; color:var(--ink-2); font-size:12.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lines li.on .to { color:var(--accent); }
.lines .n { margin-left:auto; font:600 11.5px var(--mono); color:var(--ok); flex:none; }
.lines .n.zero { color:var(--ink-3); font-weight:400; }
/* 上游把营运状态塞进线路名后缀，摘出来做徽章并压暗整行 */
.lines .tag { flex:none; font-size:10.5px; padding:1px 6px; border-radius:999px;
  background:color-mix(in srgb, var(--bad) 13%, transparent); color:var(--bad); }
.lines li.off .badge { opacity:.4; }
.lines li.off .to { opacity:.5; }
.lines li.note { cursor:default; background:none; border-color:transparent;
  color:var(--ink-3); font-size:12.5px; padding:10px 2px; }
.lines li.note.bad { color:var(--bad); }

/* ── 实时到站卡（侧栏）─────────────────────────────────────────────── */
/* 班次切换：只有 6 路有夜班，其余线路这行是空的（:empty 直接隐藏）。
   横排两格——「日班」「夜班」是短词，竖排没必要。 */
.shifts { display:flex; gap:6px; margin-bottom:9px; }
.shifts:empty { display:none; }
.shifts button { flex:1; min-width:0; display:flex; align-items:center; justify-content:center;
  gap:7px; padding:7px 10px; border-radius:9px; cursor:pointer; background:var(--surface-2);
  border:1px solid var(--line-soft); color:var(--ink-3); font:12.5px var(--sans); }
.shifts button:hover { border-color:var(--ink-3); color:var(--ink-2); }
.shifts button.on { border-color:var(--accent); background:var(--accent-soft);
  color:var(--accent); font-weight:600; }
.shifts .ss { font:11px var(--mono); opacity:.85; }

/* 方向切换：线路双向，地图与到站列表一次只画一个方向。
   竖排整行而不是并排两格 —— 终点站名（「汽车总站（二医院）」）并排放不下会被截。 */
.dirs { display:flex; flex-direction:column; gap:6px; margin-bottom:9px; }
.dirs:empty { display:none; }
.dirs button { display:flex; align-items:center; gap:8px; padding:8px 11px; border-radius:9px;
  cursor:pointer; background:var(--surface-2); border:1px solid var(--line-soft);
  color:var(--ink-3); font:12px var(--sans); text-align:left; }
.dirs button:hover { border-color:var(--ink-3); color:var(--ink-2); }
.dirs button.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
.dirs .tt { flex:1; min-width:0; font-weight:600; font-size:12.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dirs .ss { flex:none; font:600 11px var(--mono); opacity:.85; }

.arr { display:flex; flex-direction:column; gap:7px; }
.arr .note { color:var(--ink-3); font-size:12.5px; padding:10px 2px; }
.acard { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px;
  background:var(--surface-2); border:1px solid var(--line-soft); }
.acard .dest { min-width:0; flex:1; }
.acard .dest b { display:block; font-size:13.5px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acard .dest span { display:block; font-size:11.5px; color:var(--ink-3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acard .eta { flex:none; font:700 16px var(--mono); color:var(--ok); white-space:nowrap; }
.acard.soon .eta { color:var(--warn); }
.acard.gone .eta { color:var(--ink-3); font-weight:500; font-size:13px; }

/* ── 本线信息 ──────────────────────────────────────────────────────── */
.meta { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px 10px; font-size:12.5px; }
.meta .k { color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta .v { color:var(--ink-2); text-align:right; font-family:var(--mono); white-space:nowrap; }
.meta .v.txt { font-family:var(--sans); }
.meta .v.run { color:var(--ok); }
.meta .v.idle { color:var(--warn); }
.meta .v.off { color:var(--bad); }

/* ── 地图舞台 ──────────────────────────────────────────────────────── */
/* 底图是高德 JS API 的真实瓦片（不再自绘示意图）。--map 只当瓦片到位前的底色。 */
.stage { position:relative; flex:1; min-height:0; background:var(--map); overflow:hidden; }
.map { position:absolute; inset:0; width:100%; height:100%; display:block; }

/* 覆盖物是高德 Marker 的自定义 content，所以走普通 CSS 类，能直接用主题变量 */
.am-stop { position:relative; width:14px; height:14px; border-radius:50%; box-sizing:border-box;
  background:var(--surface); border:3px solid var(--accent); cursor:pointer; transition:transform .12s ease; }
.am-stop:hover { transform:scale(1.3); }
.am-stop.term { background:var(--accent); }
/* .on 必须排在 .term 之后：同优先级，靠后者生效 */
.am-stop.on { background:var(--accent); border-color:#fff; box-shadow:0 0 0 3px var(--accent-soft); }
.am-stop.skip { border-color:var(--bad); }
/* 站名做成底色小片压在瓦片上，比给文字描边稳 —— 瓦片底色深浅不可控 */
.am-lab { position:absolute; left:50%; top:15px; transform:translateX(-50%); white-space:nowrap;
  font:600 12px var(--sans); color:var(--ink-2); background:var(--surface);
  padding:1px 6px; border-radius:5px; box-shadow:var(--shadow); }
.am-stop.on .am-lab { color:var(--accent); }
.am-stop.skip .am-lab { color:var(--bad); }
.am-bus { width:24px; height:24px; border-radius:7px; background:var(--accent); box-sizing:border-box;
  border:2px solid var(--surface); display:grid; place-items:center; box-shadow:var(--shadow); }
.am-bus svg { width:13px; height:13px; fill:#fff; }
.hint { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:0 24px;
  color:var(--ink-3); font-size:13.5px; pointer-events:none; }

/* ── 顶栏：浮在地图上（设计稿里不是通栏标题栏）─────────────────────── */
.topbar { position:absolute; top:12px; left:12px; right:12px; z-index:5;
  display:flex; align-items:center; gap:9px; pointer-events:none; }
/* 容器不吃事件（否则挡住地图拖拽），只有控件吃 */
.topbar > * { pointer-events:auto; }
.search { flex:1; max-width:440px; position:relative; }
.search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px;
  color:var(--ink-3); pointer-events:none; }
.search input { width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  color:var(--ink); font:13.5px var(--sans); padding:9px 12px 9px 34px; box-shadow:var(--shadow); }
.search input::placeholder { color:var(--ink-3); }
.topbar .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:10px;
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
  white-space:nowrap; font-size:12px; color:var(--ink-2); }
.pill.run { color:var(--ok); }
.pill.idle { color:var(--warn); }
.pill.off { color:var(--bad); }
.live { width:6px; height:6px; border-radius:50%; background:currentColor; }
.iconbtn { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
  border-radius:10px; background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
  cursor:pointer; padding:0; flex:none; box-shadow:var(--shadow); }
.iconbtn:hover { color:var(--ink); border-color:var(--ink-3); }
/* 必须双类：.iconbtn 的 display 在后面且同优先级，单类会被盖掉 */
.iconbtn.menubtn { display:none; }
/* 图标跟着主题走，省掉 JS 换 innerHTML */
[data-theme="dark"] .ico-sun { display:none; }
[data-theme="light"] .ico-moon { display:none; }

/* ── 到站卡：桌面浮在地图左下，移动端变底部抽屉 ────────────────────── */
.card { position:absolute; left:16px; bottom:16px; width:min(420px,calc(100% - 32px));
  max-height:calc(100% - 90px); overflow-y:auto; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:none; z-index:4; }
.card.on { display:block; }
.grab { display:none; width:38px; height:4px; border-radius:2px; background:var(--line);
  margin:0 auto 10px; cursor:grab; touch-action:none; }
.grab:active { cursor:grabbing; }

.businfo .h { display:flex; align-items:baseline; gap:9px; margin-bottom:10px; flex-wrap:wrap; }
.businfo .stn { font-size:16px; font-weight:650; }
.businfo .dir { color:var(--ink-3); font-size:12px; margin-left:auto; }
.businfo .row { display:flex; align-items:baseline; gap:10px; padding:7px 0; font-size:13px;
  border-bottom:1px solid var(--line-soft); }
.businfo .row:last-child { border-bottom:0; }
.businfo .row .fno { font-family:var(--mono); font-weight:650; color:var(--ink); }
.businfo .row .eta { margin-left:auto; font-weight:650; color:var(--ok); font-size:14px; }
.businfo .row .at { color:var(--ink-3); font-size:12px; font-family:var(--mono); }
.businfo .note { color:var(--ink-3); font-size:13px; padding:6px 0; }
.businfo .note.bad { color:var(--bad); }

/* ── 线路走向条（在侧栏）───────────────────────────────────────────── */
/* 设计稿没有它，但它承载夜班差异路段，删了会丢信息 */
.railbox { margin-bottom:10px; }
.railhead { display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:8px; flex-wrap:wrap; }
.railhead .dir { font-weight:600; }
.railhead .st { font-size:11px; padding:2px 7px; border-radius:999px; }
.railhead .st.run { background:color-mix(in srgb, var(--ok) 13%, transparent); color:var(--ok); }
.railhead .st.idle { background:color-mix(in srgb, var(--warn) 15%, transparent); color:var(--warn); }
.railhead .st.off { background:color-mix(in srgb, var(--bad) 13%, transparent); color:var(--bad); }
.railhead .cnt { color:var(--ink-3); font-size:11.5px; margin-left:auto; font-family:var(--mono); }
.railhead .legend { font-size:11px; color:var(--bad); }
.railscroll { overflow-x:auto; padding-bottom:2px; }
.rail { display:flex; align-items:flex-start; min-width:min-content; }
/* 站名横排。不用 writing-mode:vertical-rl —— 实测无头 Chromium 缺竖排字体度量，
   字会挤成墨团（高度 0），且真实浏览器行为无法在此验证。 */
.rstop { position:relative; flex:0 0 auto; width:58px; display:flex; flex-direction:column; align-items:center;
  cursor:pointer; }
.rstop::before { content:''; position:absolute; left:0; right:0; top:22px; height:2px;
  background:var(--accent); opacity:.4; }
.rstop .dot { position:relative; z-index:1; width:9px; height:9px; border-radius:50%;
  background:var(--surface); border:2px solid var(--accent); }
.rstop.term .dot { background:var(--accent); }
.rstop.on .dot { background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.rstop:hover .nm, .rstop.on .nm { color:var(--ink); }
.rstop.on .nm { color:var(--accent); font-weight:650; }
.rstop .nm { margin-top:5px; font-size:10.5px; line-height:1.3; color:var(--ink-3); text-align:center;
  height:2.6em; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; text-wrap:balance; }
.rstop.term .nm { font-weight:650; color:var(--ink-2); }
/* 夜班不停的站标红。放最后并带上 .term/.on，否则同优先级靠后的规则会把红字盖掉。 */
.rstop.skip .dot { border-color:var(--bad); }
.rstop.skip .nm, .rstop.skip.term .nm, .rstop.skip.on .nm { color:var(--bad); }
.rbuswrap { height:20px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:2px; }
.rbus { display:inline-flex; align-items:center; gap:3px; height:18px; padding:0 5px; border-radius:5px;
  background:var(--accent); color:#fff; font:600 10.5px var(--mono); }
.rbus svg { width:10px; height:10px; flex:none; }

/* ── 移动端（必须放最后，否则被上面的基础规则覆盖）────────────────── */
@media (max-width:820px) {
  .shell { grid-template-columns:1fr; }
  .side { position:fixed; top:0; bottom:0; left:0; z-index:20; height:100dvh;
    width:min(86vw,330px); padding-top:env(safe-area-inset-top);
    transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow); }
  .side.open { transform:none; }
  .scrim { display:block; position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .iconbtn.menubtn { display:inline-flex; }
  .topbar { top:calc(9px + env(safe-area-inset-top)); left:10px; right:10px; gap:8px; }
  .topbar .right .pill { display:none; }   /* 手机上只留刷新与主题；状态在侧栏看 */
  .lines li { padding:11px; }

  /* 到站卡改底部抽屉。用 transform 而不是 display，否则滑入没有过渡。 */
  .card { left:0; right:0; bottom:0; width:auto; border:0; border-top:1px solid var(--line);
    border-radius:16px 16px 0 0; max-height:64dvh; display:block;
    padding:0 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .22s ease; pointer-events:none; }
  .card.on { transform:none; pointer-events:auto; }
  .grab { display:block; margin-top:9px; }
  .rbus { height:22px; padding:0 7px; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2zm0 1v5h12V3H2zm1 7.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm10 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>
      </span>
      <div>
        <div class="name">玉林实时公交</div>
        <div class="sub" id="cityline">车来了 · 玉林市</div>
      </div>
    </div>

    <div class="sidebody">
      <section class="sect">
        <h2>实时到站 <span class="tail" id="upd">—</span></h2>
        <div class="shifts" id="shifts"></div>
        <div class="dirs" id="dirs"></div>
        <div class="arr" id="arr"></div>
      </section>

      <section class="sect">
        <h2>本线信息</h2>
        <div class="meta" id="meta"></div>
      </section>

      <section class="sect">
        <h2>线路 <span class="tail" id="linecnt"></span></h2>
        <ul class="lines" id="lines"><li class="note">加载中…</li></ul>
      </section>

      <section class="sect">
        <h2>线路走向</h2>
        <div id="rails"></div>
      </section>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="stage" id="stage">
      <div class="map" id="map" role="img" aria-label="线路地图"></div>
      <div class="hint" id="hint">左侧选一条线路。</div>

      <div class="topbar">
        <button class="iconbtn menubtn" id="btnMenu" type="button" aria-label="选择线路">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
        </button>
        <div class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.4"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="搜索线路、起终点…" autocomplete="off" aria-label="搜索线路">
        </div>
        <div class="right">
          <span class="pill" id="state"><span class="live"></span><span id="statetxt">—</span></span>
          <button class="iconbtn" id="btnRefresh" type="button" aria-label="刷新">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 8a5.6 5.6 0 1 1-1.7-4"/><path d="M13.7 1.8v3.4h-3.4"/></svg>
          </button>
          <button class="iconbtn" id="btnTheme" type="button" aria-label="切换主题">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4">
