<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玉林实时公交</title>
<style>
/* ── 设计令牌（沿用 workbuddy2api-panel 的冷石墨基调）───────────────── */
:root {
  --bg:#0c0e14; --surface:#14171f; --surface-2:#1a1e28; --raise:#202531;
  --line:#262c3a; --line-soft:#1e232e;
  --ink:#e8ebf2; --ink-2:#a8b0c2; --ink-3:#838b9b;
  --accent:#5b7cfa; --accent-ink:#fff; --accent-soft:rgba(91,124,250,.13);
  --ok:#3ddc97; --ok-soft:rgba(61,220,151,.12);
  --warn:#f5b544; --warn-soft:rgba(245,181,68,.12);
  --bad:#f0655f; --bad-soft:rgba(240,101,95,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
[data-theme="light"] {
  --bg:#f4f5f8; --surface:#fff; --surface-2:#f8f9fb; --raise:#fff;
  --line:#e2e5ec; --line-soft:#eceef3;
  --ink:#14171f; --ink-2:#545c6e; --ink-3:#686e7b;
  --accent:#3d5fe0; --accent-ink:#fff; --accent-soft:rgba(61,95,224,.09);
  --ok:#0b7548; --ok-soft:rgba(15,157,99,.1);
  --warn:#8a5a0c; --warn-soft:rgba(180,118,17,.11);
  --bad:#c03630; --bad-soft:rgba(207,59,52,.09);
  --shadow:0 1px 2px rgba(16,20,32,.06),0 8px 24px -14px rgba(16,20,32,.14);
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
html,body { height:100%; }
body { background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ── 壳层 ──────────────────────────────────────────────────────────── */
.shell { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
@media (max-width:820px) { .shell { grid-template-columns:1fr; } .side { height:auto !important; position:static !important; } }

.side { background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.brand { padding:18px 16px 14px; border-bottom:1px solid var(--line-soft); }
.brand .name { font-weight:650; font-size:15px; letter-spacing:-.01em; }
.brand .sub { color:var(--ink-3); font-size:11.5px; font-family:var(--mono); margin-top:3px; }
.search { padding:10px 12px; border-bottom:1px solid var(--line-soft); }
.search input { width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; color:var(--ink); font:13.5px var(--sans); padding:7px 10px; }
.search input::placeholder { color:var(--ink-3); }

.lines { list-style:none; overflow-y:auto; flex:1; padding:6px 8px 16px; }
.lines li { display:flex; align-items:center; gap:10px; padding:8px 11px; margin-bottom:2px; border-radius:7px; cursor:pointer; color:var(--ink-2); font-size:13.5px; }
.lines li:hover { background:var(--surface-2); color:var(--ink); }
.lines li.on { background:var(--accent-soft); color:var(--accent); font-weight:550; }
.lines .no { font-family:var(--mono); font-weight:600; min-width:56px; flex:none; }
.lines .to { color:var(--ink-3); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lines li.on .to { color:var(--accent); opacity:.75; }
.lines .n { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ok); flex:none; }
.lines .n.zero { color:var(--ink-3); }

/* ── 主区 ──────────────────────────────────────────────────────────── */
.main { display:flex; flex-direction:column; min-width:0; }
.top { display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:2; }
.top h1 { font-size:17px; font-weight:650; letter-spacing:-.01em; }
.top .meta { color:var(--ink-3); font-size:12.5px; }
.top .right { margin-left:auto; display:flex; align-items:center; gap:12px; color:var(--ink-3); font-size:12px; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); }
.pill.run { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
.pill.idle { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.pill.off { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.live { width:6px; height:6px; border-radius:50%; background:var(--ok); }
.iconbtn { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:7px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); cursor:pointer; padding:0; }
.iconbtn:hover { color:var(--ink); border-color:var(--ink-3); }
/* 图标跟着主题走，省掉 JS 换 innerHTML */
[data-theme="dark"] .ico-sun { display:none; }
[data-theme="light"] .ico-moon { display:none; }

.body { padding:18px 22px 40px; }
.note { padding:14px 16px; color:var(--ink-3); font-size:13px; }
.note.bad { color:var(--bad); }
.sect { margin-top:20px; }
.sect h2 { font-size:13px; font-weight:600; color:var(--ink-3); margin-bottom:10px; letter-spacing:.02em; }

/* ── 走向条：两方向共用一条轴，各占一条轨 ──────────────────────────
   每轨按自己的行车顺序排；反向轨倒序渲染，端点因此左右对齐。
   中间站只是大致对齐 —— 23 条线里只有 1 条两方向严格互逆，其余站表不同。 */
.strip { display:flex; flex-direction:column; gap:14px; }
.railbox { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
.railhead { display:flex; align-items:center; gap:9px; padding:11px 16px; border-bottom:1px solid var(--line-soft); font-size:13px; flex-wrap:wrap; }
.railhead .dir { font-weight:600; }
.railhead .st { font-size:11.5px; padding:2px 8px; border-radius:999px; }
.railhead .st.run { background:var(--ok-soft); color:var(--ok); }
.railhead .st.idle { background:var(--warn-soft); color:var(--warn); }
.railhead .st.off { background:var(--bad-soft); color:var(--bad); }
.railhead .cnt { color:var(--ink-3); font-size:12px; margin-left:auto; font-family:var(--mono); }

.railscroll { overflow-x:auto; padding:14px 16px 6px; }
.rail { display:flex; align-items:flex-start; min-width:min-content; }
/* 站名横排。不用 writing-mode:vertical-rl —— 实测无头 Chromium 缺竖排字体度量，
   字会挤成墨团（高度 0），且真实浏览器行为无法在此验证。 */
.rstop { position:relative; flex:0 0 auto; width:64px; display:flex; flex-direction:column; align-items:center; cursor:pointer; }
.rstop:hover .dot { border-color:var(--ink); }
.rstop:hover .nm { color:var(--ink); }
.rstop.on .dot { background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.rstop.on .nm { color:var(--accent); font-weight:650; }
.rstop::before { content:''; position:absolute; left:0; right:0; top:44px; height:2px; background:var(--accent); opacity:.45; }
.rstop .dot { position:relative; z-index:1; width:9px; height:9px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); }
.rstop.term .dot { background:var(--accent); }
.rstop .nm { margin-top:6px; font-size:11px; line-height:1.35; color:var(--ink-2); text-align:center;
  height:2.7em; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  text-wrap:balance; }
.rstop.term .nm { font-weight:650; color:var(--ink); }
/* 车辆图标区固定高度，各站圆点才落在同一条 y 上 */
.rbuswrap { height:40px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:2px; }
.railcap { flex:0 0 auto; width:12px; height:40px; position:relative; }
.railcap::before { content:''; position:absolute; top:39px; width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; }
.railcap.r::before { left:0; border-left:9px solid var(--accent); }

.rbus { display:inline-flex; align-items:center; gap:3px; height:18px; padding:0 5px; border-radius:5px;
  background:var(--accent); color:var(--accent-ink); font:600 10.5px var(--mono); }
.rbus svg { width:10px; height:10px; flex:none; }

/* ── 到站信息 ──────────────────────────────────────────────────────── */
.businfo { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:14px 16px; }
.businfo .h { display:flex; align-items:baseline; gap:9px; margin-bottom:9px; flex-wrap:wrap; }
.businfo .stn { font-size:16px; font-weight:650; }
.businfo .dir { color:var(--ink-3); font-size:12px; margin-left:auto; }
.businfo .row { display:flex; align-items:baseline; gap:10px; padding:5px 0; font-size:13px; border-bottom:1px solid var(--line-soft); }
.businfo .row:last-child { border-bottom:0; }
.businfo .row .fno { font-family:var(--mono); font-weight:650; color:var(--ink); }
.businfo .row .eta { margin-left:auto; font-weight:600; color:var(--accent); }
.businfo .row .at { color:var(--ink-3); font-size:12px; font-family:var(--mono); }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="name">玉林实时公交</div>
      <div class="sub" id="cityline">车来了 · 玉林市</div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="搜索线路 / 起终点…" autocomplete="off"></div>
    <ul class="lines" id="lines"><li class="note">加载中…</li></ul>
  </aside>

  <main class="main">
    <header class="top">
      <h1 id="title">选择线路</h1>
      <span class="meta" id="sub"></span>
      <div class="right">
        <span class="pill" id="state"><span class="live"></span><span id="statetxt">—</span></span>
        <span>更新 <b class="num" id="ts">—</b></span>
        <button class="iconbtn" id="btnTheme" type="button" aria-label="切换主题">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4">
            <path class="ico-moon" d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/>
            <circle class="ico-sun" cx="8" cy="8" r="3"/>
            <path class="ico-sun" stroke-linecap="round" d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="body">
      <div class="strip" id="strip"><div class="note">左侧选一条线路。</div></div>
      <section class="sect" id="infosect" hidden>
        <h2>到站信息</h2>
        <div class="businfo" id="businfo"></div>
      </section>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
