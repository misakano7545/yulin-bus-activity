<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玉林实时公交</title>
<style>
/* ── 设计令牌（沿用 workbuddy2api-panel 的冷石墨基调）───────────────── */
:root {
  --bg:#0c0e14; --surface:#14171f; --surface-2:#1a1e28; --raise:#202531;
  --line:#262c3a; --line-soft:#1e232e;
  --ink:#e8ebf2; --ink-2:#a8b0c2; --ink-3:#6b7488;
  --accent:#5b7cfa; --accent-ink:#fff; --accent-soft:rgba(91,124,250,.13);
  --ok:#3ddc97; --ok-soft:rgba(61,220,151,.12);
  --warn:#f5b544; --warn-soft:rgba(245,181,68,.12);
  --bad:#f0655f; --bad-soft:rgba(240,101,95,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
html,body { height:100%; }
body { background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ── 壳层 ──────────────────────────────────────────────────────────── */
.shell { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
@media (max-width:820px) { .shell { grid-template-columns:1fr; } .side { height:auto !important; position:static !important; } }

.side { background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.brand { padding:18px 16px 14px; border-bottom:1px solid var(--line-soft); }
.brand .name { font-weight:650; font-size:15px; letter-spacing:-.01em; }
.brand .sub { color:var(--ink-3); font-size:11.5px; font-family:var(--mono); margin-top:3px; }
.search { padding:10px 12px; border-bottom:1px solid var(--line-soft); }
.search input { width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; color:var(--ink); font:13.5px var(--sans); padding:7px 10px; }
.search input::placeholder { color:var(--ink-3); }

.lines { list-style:none; overflow-y:auto; flex:1; padding:6px 8px 16px; }
.lines li { display:flex; align-items:center; gap:10px; padding:8px 11px; margin-bottom:2px; border-radius:7px; cursor:pointer; color:var(--ink-2); font-size:13.5px; }
.lines li:hover { background:var(--surface-2); color:var(--ink); }
.lines li.on { background:var(--accent-soft); color:var(--accent); font-weight:550; }
.lines .no { font-family:var(--mono); font-weight:600; min-width:56px; flex:none; }
.lines .to { color:var(--ink-3); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lines li.on .to { color:var(--accent); opacity:.75; }
.lines .dot { width:5px; height:5px; border-radius:50%; flex:none; margin-left:auto; }
.dot.run { background:var(--ok); } .dot.idle { background:var(--ink-3); } .dot.off { background:var(--bad); }

/* ── 主区 ──────────────────────────────────────────────────────────── */
.main { display:flex; flex-direction:column; min-width:0; }
.top { display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:2; }
.top h1 { font-size:17px; font-weight:650; letter-spacing:-.01em; }
.top .meta { color:var(--ink-3); font-size:12.5px; }
.top .right { margin-left:auto; display:flex; align-items:center; gap:12px; color:var(--ink-3); font-size:12px; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); }
.pill.run { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
.pill.idle { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.pill.off { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.live { width:6px; height:6px; border-radius:50%; background:var(--ok); }

.body { padding:18px 22px 40px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; }
.note { padding:14px 16px; color:var(--ink-3); font-size:13px; }
.note.bad { color:var(--bad); }

/* ── 站点时间轴 ────────────────────────────────────────────────────── */
.stops { list-style:none; }
.stops li { display:flex; align-items:center; gap:12px; padding:9px 16px; border-bottom:1px solid var(--line-soft); position:relative; }
.stops li:last-child { border-bottom:0; }
.stops .ord { font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-3); font-size:11.5px; width:22px; text-align:right; flex:none; }
.stops .rail { position:absolute; left:54px; top:0; bottom:0; width:1px; background:var(--line); }
.stops .pin { width:9px; height:9px; border-radius:50%; border:2px solid var(--line); background:var(--surface); flex:none; z-index:1; }
.stops li.term .pin { border-color:var(--accent); }
.stops .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stops .bus { display:inline-flex; align-items:center; gap:7px; background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:2px 9px; font-size:12px; font-weight:550; flex:none; }
.stops .bus .fno { font-family:var(--mono); }
.stops .bus .eta { color:var(--ink-2); font-weight:450; }

/* ── 车辆总览 ──────────────────────────────────────────────────────── */
.buses { display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
.buscard { background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:12px 14px; }
.buscard .h { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
.buscard .fno { font-family:var(--mono); font-size:17px; font-weight:650; }
.buscard .pl { color:var(--ink-3); font-size:11.5px; font-family:var(--mono); }
.buscard .row { display:flex; justify-content:space-between; gap:10px; color:var(--ink-2); font-size:12.5px; padding:2px 0; }
.buscard .row b { font-weight:550; color:var(--ink); font-family:var(--mono); font-variant-numeric:tabular-nums; }
.sect { margin-top:22px; }
.sect h2 { font-size:13px; font-weight:600; color:var(--ink-3); margin-bottom:10px; letter-spacing:.02em; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="name">玉林实时公交</div>
      <div class="sub" id="cityline">车来了 · 玉林市</div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="搜索线路 / 起终点…" autocomplete="off"></div>
    <ul class="lines" id="lines"><li class="note">加载中…</li></ul>
  </aside>

  <main class="main">
    <header class="top">
      <h1 id="title">选择线路</h1>
      <span class="meta" id="sub"></span>
      <div class="right">
        <span class="pill" id="state"><span class="live"></span><span id="statetxt">—</span></span>
        <span>更新 <b class="num" id="ts">—</b></span>
      </div>
    </header>

    <div class="body">
      <div class="card" id="stopcard"><div class="note">左侧选一条线路。</div></div>
      <section class="sect" id="bussect" hidden>
        <h2>在线车辆</h2>
        <div class="buses" id="buses"></div>
      </section>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
